services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerhub}
      POSTGRES_USER: ${POSTGRES_USER:-careerhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      # Overrides so the container always talks to the "postgres" service on the
      # Compose network, regardless of what the host-facing .env says.
      DATABASE_URL: postgresql://${POSTGRES_USER:-careerhub}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-careerhub}?schema=public
      API_PORT: ${API_PORT:-4000}
      NODE_ENV: ${NODE_ENV:-development}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "4000:4000"
    volumes:
      - resumes_data:/app/uploads/resumes
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && node dist/server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  resumes_data:
