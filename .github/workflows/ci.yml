name: CI

# Run on every push to main and on all pull requests targeting it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck, build & test (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Integration tests run against a real Postgres (same engine as production).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careerhub
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://careerhub:postgres@localhost:5432/careerhub_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node so the pnpm cache resolves.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build (prisma generate + tsc)
        run: npm run build

      - name: Push Prisma schema (test database)
        run: npx prisma db push --skip-generate

      - name: Run integration tests
        run: npm test

  frontend:
    name: Frontend — typecheck & build (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Typecheck (tsc -b --noEmit)
        run: npx tsc -b --noEmit

      - name: Production build (tsc -b + vite)
        run: npm run build
